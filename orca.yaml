# Orca ejecuta esto al crear cada worktree de este repo, venga el despacho de
# donde venga: el CLI, el drawer de issues, una automation o el movil.
#
# Por que aqui y no en el encargo: medido sobre 239 despachos reales, 193 iban
# sin examen. El examen que escribe el despachador solo existe cuando el
# despachador es un humano (o un agente) que se acuerda de sembrarlo. Este no
# se olvida.
scripts:
  setup: |
    set -e
    # Examen BASE: mide no-regresion, no logro. Verde antes y verde despues.
    # (El examen especifico de una tarea es el contrario: rojo antes, verde
    # despues. Cuando el despachador siembre uno, pisa este a proposito — y le
    # toca incluir esta comprobacion dentro.)
    # La primera linea marca el examen como base: el plugin lo dice en el
    # tablero, para que un verde de no-regresion no se lea como uno de tarea.
    # La suite, no `node --check`: comprobar la sintaxis dejaba pasar cualquier
    # cambio de comportamiento. Son 23 s y cubre los once gates. El examen de
    # mutacion (scripts/mutantes.sh, ~4 min) no cabe aqui: rozaria el
    # GATEKEEPER_VERIFY_TIMEOUT de 300 s. Ese se corre al recoger.
    printf '# gatekeeper:baseline\nnode --test test/*.test.mjs\n' > .gatekeeper-verify
    printf '.gatekeeper-verify\n.gatekeeper-protected\ntest/harness.mjs\nscripts/mutantes.sh\n' > .gatekeeper-protected
